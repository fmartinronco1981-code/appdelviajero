<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La App del Viajero - Privada y Local</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js & Globe.gl -->
    <script src="https://unpkg.com/three@0.150.0/build/three.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .native-file-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer; z-index: 50;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center z-20">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center text-white font-bold shadow-lg">
                <i class="fa-solid fa-earth-americas"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">La App del Viajero</h1>
                <p class="text-xs text-slate-400">100% Local, Privada y Offline</p>
            </div>
        </div>
        <div class="flex space-x-2">
            <button onclick="switchTab('globe')" id="btn-globe" class="px-3 py-1.5 rounded-lg text-sm bg-emerald-600 text-white font-medium transition shadow"><i class="fa-solid fa-globe mr-1.5"></i> Globo</button>
            <button onclick="switchTab('trips')" id="btn-trips" class="px-3 py-1.5 rounded-lg text-sm bg-slate-700 text-slate-300 font-medium transition hover:bg-slate-600"><i class="fa-solid fa-suitcase mr-1.5"></i> Viajes</button>
            <button onclick="switchTab('people')" id="btn-people" class="px-3 py-1.5 rounded-lg text-sm bg-slate-700 text-slate-300 font-medium transition hover:bg-slate-600"><i class="fa-solid fa-users mr-1.5"></i> Personas</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 relative overflow-hidden">
        
        <!-- VISTA GLOBO & MAPA HD -->
        <section id="tab-globe" class="absolute inset-0 flex flex-col">
            <div id="globeContainer" class="flex-1 w-full relative cursor-grab active:cursor-grabbing"></div>
            <div id="mapHdContainer" class="absolute inset-0 hidden z-10 bg-slate-900"></div>
            
            <!-- Controles flotantes globo -->
            <div class="absolute bottom-6 left-6 z-20 flex flex-col space-y-2">
                <button onclick="toggleMapHd()" id="hdToggleBtn" class="bg-slate-800/90 backdrop-blur border border-slate-700 text-white px-4 py-2 rounded-xl shadow-lg text-sm font-medium hover:bg-slate-700 transition flex items-center">
                    <i class="fa-solid fa-map mr-2 text-emerald-400"></i> <span id="hdToggleText">Ver Mapa HD</span>
                </button>
            </div>
        </section>

        <!-- VISTA VIAJES -->
        <section id="tab-trips" class="absolute inset-0 hidden overflow-y-auto p-4 md:p-6 bg-slate-900 z-20">
            <div class="max-w-4xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold flex items-center"><i class="fa-solid fa-suitcase-rolling mr-2 text-emerald-400"></i> Mis Viajes</h2>
                    <button onclick="openTripModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-medium shadow transition flex items-center">
                        <i class="fa-solid fa-plus mr-2"></i> Nuevo Viaje
                    </button>
                </div>
                <div id="tripsList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Dinámico -->
                </div>
            </div>
        </section>

        <!-- VISTA PERSONAS -->
        <section id="tab-people" class="absolute inset-0 hidden overflow-y-auto p-4 md:p-6 bg-slate-900 z-20">
            <div class="max-w-2xl mx-auto">
                <h2 class="text-xl font-bold mb-6 flex items-center"><i class="fa-solid fa-users mr-2 text-emerald-400"></i> Gestión de Personas y Avatares</h2>
                
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 mb-6 shadow-lg">
                    <h3 class="font-semibold text-sm mb-3 text-slate-300">Añadir Nueva Persona</h3>
                    <div class="flex flex-col md:flex-row gap-3 items-center">
                        <div class="relative w-20 h-20 rounded-full bg-slate-700 border-2 border-dashed border-slate-500 overflow-hidden flex items-center justify-center shrink-0">
                            <img id="personPreviewImg" class="w-full h-full object-cover hidden">
                            <i id="personPreviewIcon" class="fa-solid fa-camera text-slate-400 text-xl"></i>
                            <input type="file" id="personFile" accept="image/*" class="native-file-overlay" onchange="previewPersonAvatar(event)">
                        </div>
                        <div class="flex-1 w-full space-y-2">
                            <input type="text" id="personNameInput" placeholder="Nombre (ej. Francisco, Laura...)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <button onclick="savePerson()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-sm font-medium transition shadow">Guardar Persona</button>
                        </div>
                    </div>
                </div>

                <div id="peopleList" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <!-- Dinámico -->
                </div>
            </div>
        </section>

    </main>

    <!-- MODAL CREAR / EDITAR VIAJE -->
    <div id="tripModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center mb-4">
                <h3 id="tripModalTitle" class="font-bold text-lg">Nuevo Viaje</h3>
                <button onclick="closeTripModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <input type="hidden" id="editTripId">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Título del Viaje</label>
                    <input type="text" id="tripTitleInput" placeholder="Ej: Escapada por España" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Descripción / Notas</label>
                    <textarea id="tripDescInput" rows="2" placeholder="Notas del viaje..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Participantes</label>
                    <div id="tripParticipantsSelector" class="flex flex-wrap gap-2 p-2 bg-slate-900 border border-slate-700 rounded-xl min-h-[50px] items-center">
                        <!-- Dinámico -->
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Fotos del Viaje (Selección Múltiple)</label>
                    <div class="relative border-2 border-dashed border-slate-600 hover:border-emerald-500 rounded-xl p-4 text-center cursor-pointer bg-slate-900/50 transition">
                        <input type="file" id="tripPhotosInput" multiple accept="image/*" class="native-file-overlay" onchange="handlePhotosSelected(event)">
                        <i class="fa-solid fa-cloud-arrow-up text-emerald-400 text-2xl mb-1"></i>
                        <p class="text-xs text-slate-300 font-medium">Toca para abrir galería y seleccionar fotos</p>
                        <p id="selectedPhotosCount" class="text-[10px] text-slate-500 mt-1">0 fotos seleccionadas</p>
                    </div>
                </div>
                <div class="flex space-x-3 pt-2">
                    <button onclick="closeTripModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl text-sm font-medium transition">Cancelar</button>
                    <button onclick="saveTrip()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-sm font-medium transition shadow">Guardar Viaje</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DETALLE ÁLBUM FOTOS -->
    <div id="albumModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-50 flex flex-col">
        <div class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center z-10">
            <h3 id="albumTitle" class="font-bold text-lg text-emerald-400">Álbum de Viaje</h3>
            <button onclick="closeAlbumModal()" class="text-slate-400 hover:text-white px-3 py-1"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 md:p-6 max-w-5xl mx-auto w-full">
            <div id="albumPhotosGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <!-- Dinámico -->
            </div>
        </div>
    </div>

    <!-- Script principal de la aplicación -->
    <script>
        let db;
        let globeInstance = null;
        let mapInstance = null;
        let isMapHdActive = false;
        let currentTempPhotos = [];
        let personTempBase64 = null;

        // Inicializar IndexedDB
        const request = indexedDB.open("TravelDiaryDB", 1);
        request.onerror = (e) => console.error("Error DB", e);
        request.onsuccess = (e) => {
            db = e.target.result;
            initApp();
        };
        request.onupgradeneeded = (e) => {
            let database = e.target.result;
            if (!database.objectStoreNames.contains("trips")) database.createObjectStore("trips", { keyPath: "id", autoIncrement: true });
            if (!database.objectStoreNames.contains("people")) database.createObjectStore("people", { keyPath: "id", autoIncrement: true });
        };

        function initApp() {
            initGlobe();
            loadTrips();
            loadPeople();
        }

        function switchTab(tab) {
            ['globe', 'trips', 'people'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).classList.remove('bg-emerald-600', 'text-white');
                document.getElementById(`btn-${t}`).classList.add('bg-slate-700', 'text-slate-300');
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).classList.remove('bg-slate-700', 'text-slate-300');
            document.getElementById(`btn-${tab}`).classList.add('bg-emerald-600', 'text-white');
            
            if (tab === 'globe' && globeInstance) {
                setTimeout(() => globeInstance._controls && globeInstance._controls.update(), 200);
            }
        }

        // --- GLOBO 3D ---
        function initGlobe() {
            const container = document.getElementById('globeContainer');
            globeInstance = Globe()(container)
                .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
                .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
                .backgroundColor('#0f172a');

            // Habilitar auto-rotación órbita suave
            const controls = globeInstance.controls();
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            container.addEventListener('pointerdown', () => { controls.autoRotate = false; });
            
            loadGlobeMarkers();
        }

        function loadGlobeMarkers() {
            if (!db) return;
            const tx = db.transaction("trips", "readonly");
            const store = tx.objectStore("trips");
            const req = store.getAll();
            req.onsuccess = () => {
                const trips = req.result;
                let points = [];
                trips.forEach(trip => {
                    if (trip.photos) {
                        trip.photos.forEach(p => {
                            if (p.lat && p.lng) {
                                points.push({
                                    lat: p.lat,
                                    lng: p.lng,
                                    size: 0.8,
                                    color: '#10b981',
                                    tripId: trip.id,
                                    tripTitle: trip.title,
                                    img: p.data
                                });
                            }
                        });
                    }
                });

                globeInstance
                    .htmlElementsData(points)
                    .htmlLat(d => d.lat)
                    .htmlLng(d => d.lng)
                    .htmlElement(d => {
                        const el = document.createElement('div');
                        el.innerHTML = `<div class="relative group cursor-pointer transform -translate-x-1/2 -translate-y-1/2">
                            <div class="w-8 h-8 rounded-full border-2 border-emerald-400 bg-slate-900 overflow-hidden shadow-lg hover:scale-125 transition">
                                <img src="${d.img}" class="w-full h-full object-cover">
                            </div>
                        </div>`;
                        el.onclick = () => openAlbumModal(d.tripId);
                        return el;
                    });
            };
        }

        // --- MAPA HD ---
        function toggleMapHd() {
            isMapHdActive = !isMapHdActive;
            const mapContainer = document.getElementById('mapHdContainer');
            const btnText = document.getElementById('hdToggleText');
            
            if (isMapHdActive) {
                mapContainer.classList.remove('hidden');
                btnText.innerText = "Ver Globo 3D";
                if (!mapInstance) {
                    mapInstance = L.map('mapHdContainer').setView([40.4168, -3.7038], 5);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapInstance);
                }
                loadMapMarkers();
            } else {
                mapContainer.classList.add('hidden');
                btnText.innerText = "Ver Mapa HD";
            }
        }

        function loadMapMarkers() {
            if (!mapInstance || !db) return;
            const tx = db.transaction("trips", "readonly");
            const store = tx.objectStore("trips");
            store.getAll().onsuccess = (e) => {
                e.target.result.forEach(trip => {
                    if (trip.photos) {
                        trip.photos.forEach(p => {
                            if (p.lat && p.lng) {
                                L.marker([p.lat, p.lng]).addTo(mapInstance)
                                 .bindPopup(`<b>${trip.title}</b><br><img src="${p.data}" class="w-24 h-24 object-cover mt-1 rounded">`);
                            }
                        });
                    }
                });
            };
        }

        // --- PERSONAS & AVATARES ---
        function previewPersonAvatar(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                personTempBase64 = event.target.result;
                const img = document.getElementById('personPreviewImg');
                img.src = personTempBase64;
                img.classList.remove('hidden');
                document.getElementById('personPreviewIcon').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        function savePerson() {
            const name = document.getElementById('personNameInput').value.trim();
            if (!name || !personTempBase64) {
                alert("Introduce un nombre y selecciona una foto.");
                return;
            }
            const tx = db.transaction("people", "readwrite");
            tx.objectStore("people").add({ name, avatar: personTempBase64 });
            tx.oncomplete = () => {
                document.getElementById('personNameInput').value = '';
                document.getElementById('personPreviewImg').classList.add('hidden');
                document.getElementById('personPreviewIcon').classList.remove('hidden');
                personTempBase64 = null;
                loadPeople();
            };
        }

        function loadPeople() {
            if (!db) return;
            const tx = db.transaction("people", "readonly");
            tx.objectStore("people").getAll().onsuccess = (e) => {
                const people = e.target.result;
                const list = document.getElementById('peopleList');
                list.innerHTML = '';
                people.forEach(p => {
                    list.innerHTML += `<div class="bg-slate-800 border border-slate-700 rounded-2xl p-3 flex items-center space-x-3 shadow">
                        <img src="${p.avatar}" class="w-12 h-12 rounded-full object-cover border border-emerald-500">
                        <div class="overflow-hidden"><h4 class="font-bold text-sm truncate">${p.name}</h4></div>
                    </div>`;
                });
                renderTripParticipantsSelector(people, []);
            };
        }

        function renderTripParticipantsSelector(people, selectedIds = []) {
            const container = document.getElementById('tripParticipantsSelector');
            container.innerHTML = '';
            if (people.length === 0) {
                container.innerHTML = `<span class="text-xs text-slate-500">No hay personas creadas aún. Añádelas en la pestaña Personas.</span>`;
                return;
            }
            people.forEach(p => {
                const isSelected = selectedIds.includes(p.id);
                container.innerHTML += `<label class="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-xl cursor-pointer border ${isSelected ? 'border-emerald-500 bg-emerald-950/30' : 'border-slate-700'}">
                    <input type="checkbox" name="participant" value="${p.id}" ${isSelected ? 'checked' : ''} class="hidden">
                    <img src="${p.avatar}" class="w-6 h-6 rounded-full object-cover">
                    <span class="text-xs font-medium">${p.name}</span>
                </label>`;
            });
        }

        // --- GESTIÓN DE VIAJES ---
        function openTripModal(tripId = null) {
            document.getElementById('editTripId').value = tripId || '';
            document.getElementById('tripTitleInput').value = '';
            document.getElementById('tripDescInput').value = '';
            currentTempPhotos = [];
            document.getElementById('selectedPhotosCount').innerText = '0 fotos seleccionadas';
            
            const tx = db.transaction("people", "readonly");
            tx.objectStore("people").getAll().onsuccess = (e) => {
                const people = e.target.result;
                if (tripId) {
                    document.getElementById('tripModalTitle').innerText = 'Editar Viaje';
                    const tripTx = db.transaction("trips", "readonly");
                    tripTx.objectStore("trips").get(tripId).onsuccess = (ev) => {
                        const trip = ev.target.result;
                        document.getElementById('tripTitleInput').value = trip.title;
                        document.getElementById('tripDescInput').value = trip.description;
                        currentTempPhotos = trip.photos || [];
                        document.getElementById('selectedPhotosCount').innerText = `${currentTempPhotos.length} fotos cargadas`;
                        renderTripParticipantsSelector(people, trip.participants || []);
                        document.getElementById('tripModal').classList.remove('hidden');
                    };
                } else {
                    document.getElementById('tripModalTitle').innerText = 'Nuevo Viaje';
                    renderTripParticipantsSelector(people, []);
                    document.getElementById('tripModal').classList.remove('hidden');
                }
            };
        }

        function closeTripModal() {
            document.getElementById('tripModal').classList.add('hidden');
        }

        function handlePhotosSelected(e) {
            const files = e.target.files;
            if (!files.length) return;
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    // Coordenadas simuladas/extraídas base
                    currentTempPhotos.push({
                        data: event.target.result,
                        lat: 40.4168 + (Math.random() - 0.5) * 10,
                        lng: -3.7038 + (Math.random() - 0.5) * 10
                    });
                    document.getElementById('selectedPhotosCount').innerText = `${currentTempPhotos.length} fotos seleccionadas`;
                };
                reader.readAsDataURL(file);
            });
        }

        function saveTrip() {
            const id = document.getElementById('editTripId').value;
            const title = document.getElementById('tripTitleInput').value.trim();
            const description = document.getElementById('tripDescInput').value.trim();
            
            if (!title) {
                alert("Por favor introduce un título para el viaje.");
                return;
            }

            const participants = Array.from(document.querySelectorAll('input[name="participant"]:checked')).map(cb => parseInt(cb.value));

            const tx = db.transaction(["trips", "people"], "readonly");
            tx.objectStore("people").getAll().onsuccess = (e) => {
                const allPeople = e.target.result;
                const tripData = {
                    title,
                    description,
                    participants,
                    photos: currentTempPhotos
                };

                const writeTx = db.transaction("trips", "readwrite");
                const store = writeTx.objectStore("trips");
                if (id) {
                    tripData.id = parseInt(id);
                    store.put(tripData);
                } else {
                    store.add(tripData);
                }

                writeTx.oncomplete = () => {
                    closeTripModal();
                    loadTrips();
                    loadGlobeMarkers();
                };
            };
        }

        function loadTrips() {
            if (!db) return;
            const tx = db.transaction(["trips", "people"], "readonly");
            const store = tx.objectStore("trips");
            store.getAll().onsuccess = (e) => {
                const trips = e.target.result;
                const peopleStore = tx.objectStore("people");
                peopleStore.getAll().onsuccess = (ev) => {
                    const allPeople = ev.target.result;
                    const peopleMap = {};
                    allPeople.forEach(p => peopleMap[p.id] = p);

                    const list = document.getElementById('tripsList');
                    list.innerHTML = '';
                    trips.forEach(trip => {
                        let avatarsHtml = '';
                        if (trip.participants) {
                            trip.participants.forEach(pId => {
                                if (peopleMap[pId]) {
                                    avatarsHtml += `<img src="${peopleMap[pId].avatar}" class="w-7 h-7 rounded-full object-cover border-2 border-slate-800 -ml-2 first:ml-0 shadow">`;
                                }
                            });
                        }

                        let coverImg = (trip.photos && trip.photos.length > 0) ? trip.photos[0].data : 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=600&q=80';

                        list.innerHTML += `<div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-lg flex flex-col">
                            <div class="h-40 relative cursor-pointer" onclick="openAlbumModal(${trip.id})">
                                <img src="${coverImg}" class="w-full h-full object-cover">
                                <div class="absolute bottom-2 right-2 bg-slate-900/80 backdrop-blur px-2.5 py-1 rounded-xl text-xs font-semibold flex items-center space-x-1">
                                    <i class="fa-solid fa-camera text-emerald-400 mr-1"></i> ${trip.photos ? trip.photos.length : 0} fotos
                                </div>
                            </div>
                            <div class="p-4 flex-1 flex flex-col justify-between">
                                <div>
                                    <h3 class="font-bold text-base mb-1">${trip.title}</h3>
                                    <p class="text-xs text-slate-400 mb-3">${trip.description || 'Sin notas adicionales.'}</p>
                                </div>
                                <div class="flex justify-between items-center pt-3 border-t border-slate-700/60">
                                    <div class="flex items-center">${avatarsHtml}</div>
                                    <div class="flex space-x-2">
                                        <button onclick="openTripModal(${trip.id})" class="text-slate-400 hover:text-emerald-400 text-sm px-2 py-1"><i class="fa-solid fa-pen"></i></button>
                                        <button onclick="deleteTrip(${trip.id})" class="text-slate-400 hover:text-red-400 text-sm px-2 py-1"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    });
                };
            };
        }

        function deleteTrip(id) {
            if (confirm("¿Estás seguro de eliminar este viaje?")) {
                const tx = db.transaction("trips", "readwrite");
                tx.objectStore("trips").delete(id);
                tx.oncomplete = () => {
                    loadTrips();
                    loadGlobeMarkers();
                };
            }
        }

        // --- ÁLBUM MODAL ---
        function openAlbumModal(tripId) {
            const tx = db.transaction("trips", "readonly");
            tx.objectStore("trips").get(tripId).onsuccess = (e) => {
                const trip = e.target.result;
                document.getElementById('albumTitle').innerText = trip.title;
                const grid = document.getElementById('albumPhotosGrid');
                grid.innerHTML = '';
                if (trip.photos && trip.photos.length > 0) {
                    trip.photos.forEach(p => {
                        grid.innerHTML += `<div class="aspect-square rounded-xl overflow-hidden border border-slate-700 bg-slate-900 shadow">
                            <img src="${p.data}" class="w-full h-full object-cover hover:scale-105 transition">
                        </div>`;
                    });
                } else {
                    grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-8">No hay fotos en este viaje.</p>`;
                }
                document.getElementById('albumModal').classList.remove('hidden');
            };
        }

        function closeAlbumModal() {
            document.getElementById('albumModal').classList.add('hidden');
        }
    </script>
</body>
</html>
