<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La App del Viajero — Tablet y Globo 3D</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Globe.gl & Three.js -->
    <script src="https://unpkg.com/globe.gl@2.32.1/dist/globe.gl.min.js"></script>
    
    <!-- ExifReader para metadatos -->
    <script src="https://cdn.jsdelivr.net/npm/exifreader@4.21.1/dist/exif-reader.min.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #030712; font-family: 'Inter', sans-serif;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        h1, h2, h3, .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        @keyframes kenBurns {
            0% { transform: scale(1) translate(0%, 0%); }
            50% { transform: scale(1.08) translate(-1.5%, -1%); }
            100% { transform: scale(1.02) translate(1%, 0.5%); }
        }
        .ken-burns-active { animation: kenBurns 16s ease-in-out infinite alternate; }

        .view-layer {
            position: fixed; inset: 0;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .view-hidden { opacity: 0; pointer-events: none; transform: scale(1.02); }
        .view-visible { opacity: 1; pointer-events: auto; transform: scale(1); }

        .globe-pin-wrapper {
            transform: translate(-50%, -100%); cursor: pointer; pointer-events: auto;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 20;
        }
        .globe-pin-wrapper:hover { transform: translate(-50%, -108%) scale(1.1); z-index: 50; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
    </style>
</head>
<body class="text-slate-100 antialiased">

    <!-- ===================================================================== -->
    <!-- CAPA 1: MODO MARCO DIGITAL (REPOSO / PANTALLA COMPLETA)               -->
    <!-- ===================================================================== -->
    <div id="view-frame" class="view-layer view-hidden z-40 bg-black cursor-pointer" onclick="wakeUpToGlobe()">
        <img id="frame-bg-blur" src="" alt="" class="absolute inset-0 w-full h-full object-cover opacity-35 blur-2xl scale-110">
        <div class="relative w-full h-full overflow-hidden flex items-center justify-center">
            <img id="frame-main-img" src="" alt="Recuerdo" class="w-full h-full object-cover ken-burns-active transition-opacity duration-1000">
        </div>
        <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-black/40 pointer-events-none"></div>

        <div class="absolute top-6 right-8 text-right pointer-events-none drop-shadow-lg">
            <div id="frame-clock" class="text-4xl md:text-5xl font-light text-white font-display">18:45</div>
            <div id="frame-date-today" class="text-xs md:text-sm text-white/70 uppercase tracking-widest mt-1">Lunes, 16 Nov</div>
        </div>

        <div class="absolute bottom-8 left-8 right-8 flex flex-col md:flex-row md:items-end justify-between gap-4 pointer-events-none">
            <div class="max-w-2xl">
                <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/15 backdrop-blur-md border border-white/20 text-xs font-semibold text-amber-300 mb-2">
                    📍 <span id="frame-trip-location">Copenhague, Dinamarca</span>
                </div>
                <h2 id="frame-trip-title" class="text-2xl md:text-4xl font-bold text-white drop-shadow-md">Escapada Nórdica</h2>
                <p id="frame-photo-note" class="text-sm md:text-base text-slate-200 mt-1 drop-shadow"></p>
                <p id="frame-photo-date" class="text-xs text-slate-400 mt-1.5"></p>
            </div>
            <div class="flex items-center gap-4">
                <div id="frame-avatars" class="flex -space-x-3"></div>
                <div class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-full bg-white/10 backdrop-blur-md border border-white/15 text-xs text-white/80 animate-pulse">
                    <span>Toca para explorar el globo</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ===================================================================== -->
    <!-- CAPA 2: MODO GLOBO TERRÁQUEO 3D INTERACTIVO                           -->
    <!-- ===================================================================== -->
    <div id="view-globe" class="view-layer view-visible z-10 bg-slate-950 flex flex-col">
        <div id="globe-container" class="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing"></div>

        <!-- Barra Superior Flotante de Control -->
        <header class="relative z-20 m-4 md:m-6 flex flex-wrap items-center justify-between gap-3 pointer-events-none">
            <div class="pointer-events-auto flex items-center gap-3 bg-slate-900/85 backdrop-blur-xl border border-slate-700/60 px-4 py-2.5 rounded-2xl shadow-2xl">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-slate-950 shadow-lg">
                    🌍
                </div>
                <div>
                    <h1 class="text-base md:text-lg font-bold text-white leading-tight font-display">La App del Viajero</h1>
                    <p id="globe-stats" class="text-xs text-slate-400">3 destinos • 7 recuerdos guardados</p>
                </div>
            </div>

            <div class="pointer-events-auto flex items-center gap-2 bg-slate-900/85 backdrop-blur-xl border border-slate-700/60 p-1.5 rounded-2xl shadow-2xl">
                <button onclick="document.getElementById('import-file-input').click()" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border border-emerald-500/30 text-xs font-semibold transition">
                    📥 Importar (.viaje)
                </button>
                <input type="file" id="import-file-input" accept=".viaje,.json" class="hidden" onchange="handleImportFile(event)">

                <button onclick="openModal('modal-new-trip')" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold shadow-lg shadow-amber-500/20 transition">
                    + Nuevo Viaje
                </button>

                <button onclick="openGroupModal()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition" title="Gestionar Grupo">
                    👥
                </button>

                <button onclick="activateDigitalFrame()" class="p-2.5 rounded-xl bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/30 transition" title="Modo Marco Digital">
                    🖼️
                </button>

                <button onclick="toggleFullscreen()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition" title="Pantalla Completa">
                    ⛶
                </button>
            </div>
        </header>

        <!-- Carrusel Inferior de Acceso Rápido -->
        <div class="absolute bottom-6 left-4 right-4 md:left-6 md:right-6 z-20 flex flex-col items-center pointer-events-none">
            <div id="quick-trips-bar" class="pointer-events-auto flex items-center gap-2.5 overflow-x-auto max-w-full pb-1 px-2"></div>
        </div>
    </div>

    <!-- ===================================================================== -->
    <!-- CAPA 3: FICHA DE VIAJE DETALLADA                                      -->
    <!-- ===================================================================== -->
    <div id="view-trip-detail" class="view-layer view-hidden z-30 bg-slate-950/95 backdrop-blur-2xl flex flex-col overflow-hidden">
        <div class="flex-shrink-0 border-b border-slate-800 bg-slate-900/90 px-4 py-4 md:px-8 md:py-5 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <button onclick="closeTripDetail()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-2 text-sm font-medium">
                    ← Volver al Globo
                </button>
                <div>
                    <div class="flex items-center gap-2 text-xs text-amber-400 font-semibold uppercase tracking-wider">
                        <span id="detail-location">Ubicación</span> • <span id="detail-dates">Fecha</span>
                    </div>
                    <h2 id="detail-title" class="text-xl md:text-3xl font-bold text-white font-display">Título del Viaje</h2>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div id="detail-avatars" class="flex -space-x-2.5 mr-2"></div>
                <button onclick="exportCurrentTrip()" class="flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/40 text-xs font-semibold transition">
                    📤 Exportar (.viaje)
                </button>
                <button onclick="openAddPhotoToTripModal()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold shadow-lg shadow-amber-500/20 transition">
                    + Añadir Recuerdo
                </button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 md:p-8">
            <div class="max-w-7xl mx-auto">
                <p id="detail-description" class="text-slate-300 text-sm md:text-base mb-6 bg-slate-900/60 border border-slate-800/80 p-4 rounded-2xl"></p>
                <div id="detail-photos-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
            </div>
        </div>
    </div>

    <!-- ===================================================================== -->
    <!-- MODAL: CREAR NUEVO VIAJE                                              -->
    <!-- ===================================================================== -->
    <div id="modal-new-trip" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-xl font-bold text-white font-display">Crear Nuevo Destino</h3>
                <button onclick="closeModal('modal-new-trip')" class="text-slate-400 hover:text-white p-1">✕</button>
            </div>
            <form onsubmit="handleCreateTrip(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Título de la Aventura *</label>
                    <input type="text" id="trip-title-input" required placeholder="Ej: Ruta en Camper por los Alpes" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm focus:border-amber-400 focus:outline-none">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Destino / País *</label>
                        <input type="text" id="trip-location-input" required placeholder="Ej: Chamonix, Francia" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm focus:border-amber-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Coordenadas Rápidas</label>
                        <select onchange="applyPresetCoords(this.value)" class="w-full px-3 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 text-sm focus:border-amber-400 focus:outline-none">
                            <option value="">Elegir lugar...</option>
                            <option value="45.9237,6.8694">Chamonix, Alpes</option>
                            <option value="35.6762,139.6503">Tokio, Japón</option>
                            <option value="40.4168,-3.7038">Madrid, España</option>
                            <option value="48.8566,2.3522">París, Francia</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Latitud *</label>
                        <input type="number" step="any" id="trip-lat-input" required value="45.9237" class="w-full px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Longitud *</label>
                        <input type="number" step="any" id="trip-lng-input" required value="6.8694" class="w-full px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Diario / Resumen</label>
                    <textarea id="trip-desc-input" rows="2" placeholder="Notas del viaje..." class="w-full px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal('modal-new-trip')" class="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-sm">Cancelar</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-sm font-bold">Guardar Destino</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===================================================================== -->
    <!-- MODAL: AÑADIR FOTO (CON EXIF AUTOMÁTICO)                              -->
    <!-- ===================================================================== -->
    <div id="modal-add-photo" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl max-w-lg w-full p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold text-white font-display">Añadir Recuerdo Fotográfico</h3>
                <button onclick="closeModal('modal-add-photo')" class="text-slate-400 hover:text-white p-1">✕</button>
            </div>
            <form onsubmit="handleAddPhotoSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Seleccionar Imagen *</label>
                    <input type="file" id="photo-file-input" accept="image/*" required onchange="processSelectedPhotoFile(event)" class="w-full text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-500 file:text-slate-950">
                    <p id="exif-status-msg" class="text-xs text-emerald-400 mt-1.5 hidden"></p>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nota o anécdota</label>
                    <input type="text" id="photo-note-input" placeholder="Ej: Atardecer inolvidable..." class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal('modal-add-photo')" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-sm">Cancelar</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-sm font-bold">Subir Foto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-xl hidden flex-col justify-between p-4 md:p-8">
        <div class="flex justify-end"><button onclick="closeLightbox()" class="p-3 rounded-full bg-white/10 text-white">✕</button></div>
        <div class="flex-1 flex items-center justify-center my-4"><img id="lightbox-img" src="" alt="" class="max-h-full max-w-full object-contain rounded-2xl shadow-2xl"></div>
        <div class="text-center max-w-xl mx-auto"><p id="lightbox-note" class="text-white font-medium"></p></div>
    </div>

    <div id="toast-container" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2"></div>

    <script>
        const DB_NAME = 'ViajeroAppDatabase';
        const DB_VERSION = 1;
        let db = null;

        let state = {
            trips: [],
            activeTripId: null,
            mode: 'globe', // 'frame' | 'globe' | 'detail'
            framePhotos: [],
            frameIndex: 0,
            frameInterval: null,
            inactivityTimer: null,
            pendingPhotoBase64: null,
            pendingExifCoords: null
        };
        let globeInstance = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('trips')) database.createObjectStore('trips', { keyPath: 'id' });
                    if (!database.objectStoreNames.contains('travelers')) database.createObjectStore('travelers', { keyPath: 'id' });
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        function dbGetAll(storeName) {
            return new Promise(resolve => {
                const tx = db.transaction(storeName, 'readonly');
                const req = tx.objectStore(storeName).getAll();
                req.onsuccess = () => resolve(req.result || []);
            });
        }

        function dbPut(storeName, item) {
            return new Promise(resolve => {
                const tx = db.transaction(storeName, 'readwrite');
                tx.objectStore(storeName).put(item);
                tx.oncomplete = () => resolve();
            });
        }

        async function seedDemoDataIfNeeded() {
            const trips = await dbGetAll('trips');
            if (trips.length === 0) {
                const demoTrips = [
                    {
                        id: 'trip_1',
                        title: 'Aventura en los Alpes',
                        location: 'Chamonix, Francia',
                        lat: 45.9237,
                        lng: 6.8694,
                        startDate: 'Jul 2026',
                        description: 'Escapada alpina entre glaciares y cumbres nevadas.',
                        photos: [
                            { id: 'p1', url: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1600&q=85', note: 'Refugio de montaña al atardecer' }
                        ]
                    },
                    {
                        id: 'trip_2',
                        title: 'Magia en Kioto',
                        location: 'Kioto, Japón',
                        lat: 35.0116,
                        lng: 135.7681,
                        startDate: 'Abr 2026',
                        description: 'Templos milenarios y paseos por los bosques de bambú.',
                        photos: [
                            { id: 'p2', url: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=1600&q=85', note: 'Santuario Fushimi Inari' }
                        ]
                    },
                    {
                        id: 'trip_3',
                        title: 'Escapada Nórdica',
                        location: 'Copenhague, Dinamarca',
                        lat: 55.6761,
                        lng: 12.5683,
                        startDate: 'Nov 2026',
                        description: 'Canales pintorescos y diseño danés.',
                        photos: [
                            { id: 'p3', url: 'https://images.unsplash.com/photo-1513622470522-26c3c8a854bc?w=1600&q=85', note: 'Casas de colores en Nyhavn' }
                        ]
                    }
                ];
                for (const t of demoTrips) await dbPut('trips', t);
            }

            const travelers = await dbGetAll('travelers');
            if (travelers.length === 0) {
                const demoTravelers = [
                    { id: 't1', name: 'Franky', avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150' },
                    { id: 't2', name: 'Laura', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150' },
                    { id: 't3', name: 'Carlos', avatar: 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=150' }
                ];
                for (const tr of demoTravelers) await dbPut('travelers', tr);
            }
        }

        async function reloadData() {
            state.trips = await dbGetAll('trips');
            updateStatsUI();
            renderQuickTripsBar();
            updateGlobeMarkers();
        }

        // Globo 3D
        function initGlobe() {
            if (globeInstance) {
                updateGlobeMarkers();
                return;
            }
            const container = document.getElementById('globe-container');
            globeInstance = Globe()(container)
                .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
                .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
                .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
                .atmosphereColor('#38bdf8')
                .atmosphereAltitude(0.18)
                .htmlElementsData([])
                .htmlElement(trip => createTripPinElement(trip));

            const controls = globeInstance.controls();
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;
            globeInstance.pointOfView({ lat: 35, lng: 15, altitude: 2.2 }, 0);

            window.addEventListener('resize', () => {
                if (globeInstance) globeInstance.width(window.innerWidth).height(window.innerHeight);
            });
        }

        function createTripPinElement(trip) {
            const wrapper = document.createElement('div');
            wrapper.className = 'globe-pin-wrapper flex flex-col items-center';
            wrapper.innerHTML = `
                <div class="px-3.5 py-1.5 rounded-2xl bg-slate-950/90 border border-amber-400 shadow-2xl flex items-center gap-2">
                    <div class="flex -space-x-2">
                        <div class="w-6 h-6 rounded-full bg-amber-500 overflow-hidden border border-slate-900 flex items-center justify-center text-[10px] font-bold text-slate-950">🌍</div>
                    </div>
                    <span class="text-xs font-bold text-white whitespace-nowrap">${trip.location.split(',')[0]} (${trip.photos.length})</span>
                </div>
                <div class="w-0.5 h-3 bg-amber-400"></div>
            `;
            wrapper.onclick = (e) => { e.stopPropagation(); focusAndOpenTrip(trip.id); };
            return wrapper;
        }

        function updateGlobeMarkers() {
            if (!globeInstance) return;
            globeInstance.htmlElementsData(state.trips);
        }

        function focusAndOpenTrip(tripId) {
            const trip = state.trips.find(t => t.id === tripId);
            if (!trip) return;
            if (globeInstance) {
                globeInstance.controls().autoRotate = false;
                globeInstance.pointOfView({ lat: trip.lat, lng: trip.lng, altitude: 1.15 }, 900);
            }
            setTimeout(() => openTripDetail(tripId), 600);
        }

        // Marco Digital
        function activateDigitalFrame(specificTripId = null) {
            let pool = [];
            const sourceTrips = specificTripId ? state.trips.filter(t => t.id === specificTripId) : state.trips;
            sourceTrips.forEach(trip => {
                trip.photos.forEach(photo => pool.push({ photo, trip }));
            });

            if (pool.length === 0) {
                showToast('Añade fotos a tus destinos para iniciar el Marco Digital.');
                return;
            }

            state.framePhotos = pool;
            state.frameIndex = 0;
            state.mode = 'frame';

            document.getElementById('view-frame').classList.replace('view-hidden', 'view-visible');
            document.getElementById('view-globe').classList.replace('view-visible', 'view-hidden');

            renderCurrentFrameSlide();
            clearInterval(state.frameInterval);
            state.frameInterval = setInterval(() => {
                state.frameIndex = (state.frameIndex + 1) % state.framePhotos.length;
                renderCurrentFrameSlide();
            }, 8000);
        }

        function renderCurrentFrameSlide() {
            const item = state.framePhotos[state.frameIndex];
            if (!item) return;
            document.getElementById('frame-main-img').src = item.photo.url;
            document.getElementById('frame-bg-blur').src = item.photo.url;
            document.getElementById('frame-trip-location').textContent = item.trip.location;
            document.getElementById('frame-trip-title').textContent = item.trip.title;
            document.getElementById('frame-photo-note').textContent = item.photo.note || '';
        }

        function wakeUpToGlobe() {
            clearInterval(state.frameInterval);
            state.mode = 'globe';
            document.getElementById('view-frame').classList.replace('view-visible', 'view-hidden');
            document.getElementById('view-globe').classList.replace('view-hidden', 'view-visible');
        }

        // Detalle de Viaje
        function openTripDetail(tripId) {
            const trip = state.trips.find(t => t.id === tripId);
            if (!trip) return;
            state.activeTripId = tripId;
            state.mode = 'detail';

            document.getElementById('detail-location').textContent = trip.location;
            document.getElementById('detail-dates').textContent = trip.startDate || 'Destino';
            document.getElementById('detail-title').textContent = trip.title;
            document.getElementById('detail-description').textContent = trip.description || '';

            const grid = document.getElementById('detail-photos-grid');
            if (trip.photos.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">No hay fotos en este viaje todavía.</div>`;
            } else {
                grid.innerHTML = trip.photos.map(p => `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col cursor-pointer" onclick="openLightbox('${p.url}', '${p.note || ''}')">
                        <div class="aspect-[4/3] bg-slate-950 overflow-hidden"><img src="${p.url}" class="w-full h-full object-cover"></div>
                        <div class="p-4"><p class="text-sm text-slate-200">${p.note || 'Recuerdo fotográfico'}</p></div>
                    </div>
                `).join('');
            }

            document.getElementById('view-globe').classList.replace('view-visible', 'view-hidden');
            document.getElementById('view-trip-detail').classList.replace('view-hidden', 'view-visible');
        }

        function closeTripDetail() {
            state.activeTripId = null;
            state.mode = 'globe';
            document.getElementById('view-trip-detail').classList.replace('view-visible', 'view-hidden');
            document.getElementById('view-globe').classList.replace('view-hidden', 'view-visible');
        }

        // EXIF Y SUBIDA DE FOTOS
        function openAddPhotoToTripModal() {
            state.pendingPhotoBase64 = null;
            state.pendingExifCoords = null;
            document.getElementById('photo-file-input').value = '';
            document.getElementById('photo-note-input').value = '';
            document.getElementById('exif-status-msg').classList.add('hidden');
            openModal('modal-add-photo');
        }

        async function processSelectedPhotoFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusMsg = document.getElementById('exif-status-msg');
            statusMsg.classList.remove('hidden');
            statusMsg.textContent = 'Leyendo metadatos EXIF de la foto...';

            try {
                const tags = await ExifReader.load(file);
                if (tags && tags.GPSLatitude && tags.GPSLongitude) {
                    let lat = tags.GPSLatitude.description;
                    let lng = tags.GPSLongitude.description;
                    if (tags.GPSLatitudeRef && tags.GPSLatitudeRef.description === 'S') lat = -lat;
                    if (tags.GPSLongitudeRef && tags.GPSLongitudeRef.description === 'W') lng = -lng;
                    state.pendingExifCoords = { lat, lng };
                    statusMsg.textContent = `📍 Coordenadas EXIF detectadas: (${lat.toFixed(2)}, ${lng.toFixed(2)})`;
                } else {
                    statusMsg.textContent = 'ℹ️ No hay GPS en la foto. Se usará la ubicación del viaje.';
                }
            } catch (err) {
                statusMsg.textContent = 'ℹ️ Foto cargada con éxito.';
            }

            state.pendingPhotoBase64 = await compressImageFile(file, 1600, 0.85);
        }

        function compressImageFile(file, maxWidth, quality) {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function handleAddPhotoSubmit(e) {
            e.preventDefault();
            if (!state.pendingPhotoBase64 || !state.activeTripId) return;

            const trip = state.trips.find(t => t.id === state.activeTripId);
            if (!trip) return;

            const note = document.getElementById('photo-note-input').value.trim();
            trip.photos.push({
                id: 'photo_' + Date.now(),
                url: state.pendingPhotoBase64,
                note: note
            });

            await dbPut('trips', trip);
            await reloadData();
            closeModal('modal-add-photo');
            openTripDetail(trip.id);
            showToast('¡Recuerdo añadido con éxito!');
        }

        // Exportar / Importar .viaje
        function exportCurrentTrip() {
            const trip = state.trips.find(t => t.id === state.activeTripId);
            if (!trip) return;
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ version: 1, trip }));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `${trip.title.toLowerCase().replace(/\s+/g, '_')}.viaje`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showToast('¡Archivo .viaje exportado correctamente!');
        }

        async function handleImportFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    const trip = data.trip || data;
                    if (!trip.id) trip.id = 'trip_' + Date.now();
                    await dbPut('trips', trip);
                    await reloadData();
                    showToast(`¡Viaje "${trip.title}" importado con éxito!`);
                    focusAndOpenTrip(trip.id);
                } catch (err) {
                    showToast('Error al importar el archivo.');
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsText(file);
        }

        async function handleCreateTrip(e) {
            e.preventDefault();
            const newTrip = {
                id: 'trip_' + Date.now(),
                title: document.getElementById('trip-title-input').value.trim(),
                location: document.getElementById('trip-location-input').value.trim(),
                lat: parseFloat(document.getElementById('trip-lat-input').value),
                lng: parseFloat(document.getElementById('trip-lng-input').value),
                description: document.getElementById('trip-desc-input').value.trim(),
                photos: []
            };
            await dbPut('trips', newTrip);
            await reloadData();
            closeModal('modal-new-trip');
            e.target.reset();
            focusAndOpenTrip(newTrip.id);
            showToast('Nuevo destino creado.');
        }

        function applyPresetCoords(val) {
            if (!val) return;
            const [lat, lng] = val.split(',');
            document.getElementById('trip-lat-input').value = lat;
            document.getElementById('trip-lng-input').value = lng;
        }

        function renderQuickTripsBar() {
            const bar = document.getElementById('quick-trips-bar');
            bar.innerHTML = state.trips.map(trip => `
                <button onclick="focusAndOpenTrip('${trip.id}')" class="flex items-center gap-2 px-3.5 py-2 rounded-full bg-slate-900/90 hover:bg-slate-800 backdrop-blur-xl border border-slate-700 text-xs font-medium text-slate-200 whitespace-nowrap shadow-lg">
                    <span>📍</span>
                    <span>${trip.location.split(',')[0]}</span>
                    <span class="px-1.5 py-0.2 rounded-full bg-amber-500/20 text-amber-300 text-[10px] font-bold">${trip.photos.length}</span>
                </button>
            `).join('');
        }

        function updateStatsUI() {
            const totalPhotos = state.trips.reduce((acc, t) => acc + t.photos.length, 0);
            document.getElementById('globe-stats').textContent = `${state.trips.length} destinos • ${totalPhotos} recuerdos guardados`;
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

        function openLightbox(url, note) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-note').textContent = note;
            document.getElementById('lightbox').classList.remove('hidden');
            document.getElementById('lightbox').classList.add('flex');
        }
        function closeLightbox() { document.getElementById('lightbox').classList.add('hidden'); document.getElementById('lightbox').classList.remove('flex'); }

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'px-5 py-3 rounded-2xl bg-slate-900/95 border border-amber-400/50 text-white text-xs font-medium shadow-2xl backdrop-blur-xl';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            await seedDemoDataIfNeeded();
            await reloadData();
            initGlobe();
        });
    </script>
</body>
</html>
